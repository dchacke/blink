<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 320" width="1600" height="320">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F1B45"/>
      <stop offset="0.6" stop-color="#24508F"/>
      <stop offset="0.88" stop-color="#5E86B8"/>
      <stop offset="1" stop-color="#E3A3A8"/>
    </linearGradient>
    <linearGradient id="trail" gradientUnits="userSpaceOnUse" x1="-20" y1="330" x2="1060" y2="135">
      <stop offset="0" stop-color="#FF9A3C" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#FFB547" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FFF1C8"/>
    </linearGradient>
    <linearGradient id="bigTrail" gradientUnits="userSpaceOnUse" x1="48" y1="498" x2="1060" y2="135">
      <stop offset="0" stop-color="#FF9A3C" stop-opacity="0.2"/>
      <stop offset="0.8" stop-color="#FFB547" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFF1C8"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#D8F0FF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#7FB6EE" stop-opacity="0.32"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#C3CCDB"/>
      <stop offset="1" stop-color="#7E8AA0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9EDF4"/>
      <stop offset="0.45" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#8C97AB"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF8A5C"/>
      <stop offset="0.4" stop-color="#FF5A3D"/>
      <stop offset="1" stop-color="#B8282B"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9EEF5"/>
      <stop offset="0.3" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C5CEDD"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6B5E"/>
      <stop offset="1" stop-color="#C8232C"/>
    </linearGradient>
    <radialGradient id="window" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#9BE0FF"/>
      <stop offset="1" stop-color="#1E6FD9"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6B0"/>
      <stop offset="0.45" stop-color="#FFA23A"/>
      <stop offset="1" stop-color="#FF5A2A" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="banner">
      <rect width="1600" height="320" rx="28"/>
    </clipPath>
    <clipPath id="lens">
      <circle cx="1060" cy="135" r="92"/>
    </clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <path id="star" d="M0,-1 C0.12,-0.12 0.12,-0.12 1,0 C0.12,0.12 0.12,0.12 0,1 C-0.12,0.12 -0.12,0.12 -1,0 C-0.12,-0.12 -0.12,-0.12 0,-1 Z"/>
    <g id="rocket">
      <path d="M-34,118 C-40,170 -16,220 0,262 C16,220 40,170 34,118 Z" fill="url(#flame)"/>
      <path d="M-18,118 C-20,150 -8,180 0,205 C8,180 20,150 18,118 Z" fill="#FFFBE0"/>
      <path d="M-62,30 C-104,52 -116,98 -112,146 L-62,108 Z" fill="url(#red)"/>
      <path d="M62,30 C104,52 116,98 112,146 L62,108 Z" fill="url(#red)"/>
      <rect x="-38" y="104" width="76" height="22" rx="6" fill="#5B6478"/>
      <path d="M0,-160 C45,-120 62,-60 62,10 L62,95 Q62,110 47,110 L-47,110 Q-62,110 -62,95 L-62,10 C-62,-60 -45,-120 0,-160 Z" fill="url(#body)"/>
      <path d="M0,-160 C30,-133 47,-100 55,-62 L-55,-62 C-47,-100 -30,-133 0,-160 Z" fill="url(#red)"/>
      <circle cx="0" cy="-8" r="30" fill="url(#window)" stroke="#8A97AD" stroke-width="10"/>
      <circle cx="-9" cy="-17" r="8" fill="#FFFFFF" opacity="0.7"/>
      <rect x="-8" y="52" width="16" height="84" rx="8" fill="url(#red)"/>
    </g>
  </defs>

  <g clip-path="url(#banner)">
    <rect width="1600" height="320" fill="url(#sky)"/>

    <g fill="#FFFFFF">
      <use href="#star" transform="translate(470,150) scale(12)"/>
      <use href="#star" transform="translate(1460,170) scale(16)"/>
      <use href="#star" transform="translate(230,90) scale(10)" opacity="0.8"/>
      <circle cx="90" cy="60" r="3" opacity="0.8"/>
      <circle cx="180" cy="140" r="2" opacity="0.6"/>
      <circle cx="260" cy="40" r="2.5" opacity="0.7"/>
      <circle cx="340" cy="110" r="2" opacity="0.5"/>
      <circle cx="420" cy="70" r="3" opacity="0.8"/>
      <circle cx="520" cy="30" r="2" opacity="0.6"/>
      <circle cx="610" cy="95" r="2.5" opacity="0.7"/>
      <circle cx="700" cy="50" r="2" opacity="0.5"/>
      <circle cx="790" cy="120" r="3" opacity="0.7"/>
      <circle cx="880" cy="40" r="2" opacity="0.6"/>
      <circle cx="1250" cy="60" r="2.5" opacity="0.7"/>
      <circle cx="1340" cy="140" r="2" opacity="0.5"/>
      <circle cx="1420" cy="50" r="3" opacity="0.8"/>
      <circle cx="1530" cy="110" r="2" opacity="0.6"/>
      <circle cx="1550" cy="230" r="2.5" opacity="0.5"/>
      <circle cx="1380" cy="240" r="2" opacity="0.4"/>
      <circle cx="150" cy="230" r="2" opacity="0.4"/>
      <circle cx="330" cy="200" r="2" opacity="0.35"/>
    </g>

    <!-- The rocket's trail across the sky, ending at the lens -->
    <path d="M-20,330 Q600,300 1060,135" fill="none" stroke="url(#trail)" stroke-width="18" stroke-linecap="round" opacity="0.35" filter="url(#glow)"/>
    <path d="M-20,330 Q600,300 1060,135" fill="none" stroke="url(#trail)" stroke-width="5" stroke-linecap="round"/>

    <!-- Magnifying glass -->
    <g filter="url(#shadow)">
      <g transform="translate(1060,135) rotate(-55)">
        <rect x="-18" y="110" width="36" height="44" rx="8" fill="url(#metal)"/>
        <rect x="-23" y="148" width="46" height="122" rx="23" fill="url(#handle)"/>
        <rect x="-14" y="158" width="7" height="96" rx="3.5" fill="#FFFFFF" opacity="0.3"/>
      </g>

      <!-- What the lens shows: the rocket, magnified -->
      <g clip-path="url(#lens)">
        <rect width="1600" height="320" fill="url(#sky)"/>
        <circle cx="1060" cy="135" r="92" fill="url(#glass)"/>
        <path d="M-1316,564 Q48,498 1060,135" fill="none" stroke="url(#bigTrail)" stroke-width="40" stroke-linecap="round" opacity="0.4" filter="url(#glow)"/>
        <path d="M-1316,564 Q48,498 1060,135" fill="none" stroke="url(#bigTrail)" stroke-width="11" stroke-linecap="round"/>
        <use href="#rocket" transform="translate(1060,135) rotate(70.3) scale(0.36)"/>
        <path d="M996,112 A68,68 0 0 1 1042,69" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity="0.5"/>
      </g>

      <circle cx="1060" cy="135" r="104" fill="none" stroke="url(#rim)" stroke-width="24"/>
      <circle cx="1060" cy="135" r="92" fill="none" stroke="#2A3350" stroke-width="2" opacity="0.35"/>
    </g>
  </g>
</svg>
